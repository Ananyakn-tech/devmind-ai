version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: devmind-db
    environment:
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: devmind123
      POSTGRES_DB: devmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
